name: Update GitHub Trophy

on:
schedule:
- cron: "0 0 * * 0"
workflow_dispatch:

permissions:
contents: write

jobs:
trophy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Generate trophy card
    uses: soulteary/github-profile-trophy-action@v1.0.0
    with:
      options: "username=lohitsaun&theme=onedark&column=7&margin-w=15&margin-h=15&no-bg=true&no-frame=true"
      path: profile/trophy.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit trophy card
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add profile/trophy.svg
      git diff --cached --quiet || git commit -m "Update GitHub trophy"
      git push
```
